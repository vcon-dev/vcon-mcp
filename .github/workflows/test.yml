name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test

  version-changelog:
    name: package.json version matches CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release commit touches only package.json and CHANGELOG.md, so a PR
      # branched from before it reverts the changelog with no merge conflict
      # and no failing test. That happened in #66 and cost a release cycle.
      - name: Compare versions
        run: |
          pkg=$(node -p "require('./package.json').version")
          log=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' docs/reference/CHANGELOG.md | tr -d '#[] ')
          echo "package.json: $pkg / CHANGELOG: $log"
          if [ "$pkg" != "$log" ]; then
            echo "::error file=docs/reference/CHANGELOG.md::package.json is $pkg but the newest CHANGELOG entry is $log. If this PR branched from before a release commit, rebase on main."
            exit 1
          fi

  docker-healthcheck:
    name: Docker HEALTHCHECK reaches healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CON-792: the HEALTHCHECK probed http://localhost, which resolves to [::1] while the
      # server binds 0.0.0.0. Every container reported unhealthy while serving fine.
      - name: Run healthcheck regression test
        run: ./scripts/test-docker-healthcheck.sh
