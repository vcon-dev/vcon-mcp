name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      # Publishing is triggered by the tag push itself, so `git push origin vX.Y.Z`
      # is the whole release. v1.4.0 was tagged but never published because the
      # old trigger waited on a GitHub release nobody cut.
      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag: $tag / package.json: $pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::release tag $GITHUB_REF_NAME does not match package.json $pkg"; exit 1; }

      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

